# Bound to loopback deliberately. Publishing on 0.0.0.0 makes a service
# reachable on its own port regardless of any Caddy rule — which is how a
# tailnet-only service on this project's own server turned out to be answering
# the public internet.
services:
  api:
    image: ghcr.io/example/api:1.4.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_KEY: ${SESSION_KEY}
    volumes:
      - ./data:/var/lib/api
